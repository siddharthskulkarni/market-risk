[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-risk"
version = "0.2.0"
description = "Multi-asset market risk: VaR, ES, GARCH, and regulatory backtests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "massive>=1.0",
    "pandas-datareader>=0.10",
    "lxml>=4.9",
    "html5lib>=1.1",
]
models = ["arch>=7.0"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
ingest-market-data = "market_risk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["market_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
